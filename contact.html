    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="style.css">

<body>
<div class="site-wrapper">

    <header>
        <div class="logo">
            <span aria-hidden="true">✴️</span>
            <span><strong>Simanta Swargiary</strong></span>
        </div>

        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="articles.html">Articles</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        <section class="hero">
            <h1>Contact Me</h1>
            <p>Have a question or want to work together? Fill out the form below and I'll get back to you.</p>
        </section>

        <section class="contact-section">
            <form action="#" method="post" class="contact-form">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject:</label>
                    <input type="text" id="subject" name="subject" placeholder="Inquiry about project">
                </div>

                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" cols="40" placeholder="Write your message here..." required></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">Send Message</button>
                </div>
            </form>
        </section>
    </main>

    <hr>

    <footer>
        <p>&copy; all rights reserved 2026</p>
    </footer>

</div>
</body>
