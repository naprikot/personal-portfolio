    <main>
        <section>
            <h1>Contact Me</h1>
            <p>Have a question or want to work together? Fill out the form below and I'll get back to you.</p>
        </section>

        <section>
            <form action="#" method="post">
                <div>
                    <label for="name">Full Name:</label><br>
                    <input type="text" id="name" name="name" placeholder="John Doe" required>
                </div>

                <br>

                <div>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required>
                </div>

                <br>

                <div>
                    <label for="subject">Subject:</label><br>
                    <input type="text" id="subject" name="subject" placeholder="Inquiry about project">
                </div>

                <br>

                <div>
                    <label for="message">Message:</label><br>
                    <textarea id="message" name="message" rows="5" cols="40" placeholder="Write your message here..." required></textarea>
                </div>

                <br>

                <div>
                    <button type="submit">Send Message</button>
                </div>
            </form>
        </section>
    </main>
